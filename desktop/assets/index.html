<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Odoo Desktop</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #f9f7f8; color: #302a30; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 34rem; padding: 2rem; }
    h1 { margin: 0 0 .75rem; font-size: 1.5rem; font-weight: 600; }
    p { margin: 0; line-height: 1.6; }
    small { display: block; margin-top: 1.5rem; color: #685c67; line-height: 1.6; }
    ::selection { background: #714b67; color: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { background: #231f23; color: #f4eff3; }
      small { color: #c4b9c2; }
    }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <h1>Starting Odoo…</h1>
    <p>Preparing your local workspace. This usually takes a few seconds.</p>
    <small>Closing this window stops Odoo.</small>
  </main>
</body>
</html>
